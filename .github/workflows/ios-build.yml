# Builds an UNSIGNED iOS app (.ipa) on a GitHub-hosted Mac.
# Install it on your own iPhone with Sideloadly (free Apple ID, app expires after 7 days).
# Started manually: GitHub repo > Actions > "iOS build" > Run workflow.
name: iOS build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr my_ios_app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: my_ios_app-unsigned-ipa
          path: my_ios_app-unsigned.ipa
          retention-days: 7
